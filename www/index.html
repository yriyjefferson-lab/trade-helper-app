<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Цены АЗС Златоуст</title>
<style>
  :root{
    --bg:#0f1216; --card:#171b21; --card2:#1e242c; --fg:#eef2f6;
    --dim:#8b96a5; --line:#2a323c; --acc:#39c07a; --warn:#e8a13c; --hot:#e05d5d;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    padding:12px 12px calc(24px + env(safe-area-inset-bottom));
  }
  h1{font-size:19px;margin:6px 0 2px}
  .upd{color:var(--dim);font-size:12.5px;margin-bottom:12px}
  .hero{background:linear-gradient(135deg,#14361f,#0f1216);border:1px solid var(--line);
        border-radius:16px;padding:14px;margin-bottom:14px}
  .hero .row{display:flex;gap:10px;flex-wrap:wrap}
  .hero .box{flex:1 1 45%;background:var(--card2);border-radius:12px;padding:10px 12px}
  .hero .lbl{font-size:11.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.04em}
  .hero .val{font-size:20px;font-weight:800;margin-top:3px}
  .hero .sub{font-size:11.5px;color:var(--dim);margin-top:3px}
  .tabs{display:flex;gap:8px;margin:0 0 12px}
  .tab{flex:1;padding:9px;text-align:center;border-radius:10px;background:var(--card);
       border:1px solid var(--line);font-size:13.5px;font-weight:600}
  .tab.on{background:#1d4d33;border-color:#2c7a4f}
  .list{display:flex;flex-direction:column;gap:8px}
  .st{background:var(--card);border:1px solid var(--line);border-radius:13px;
      padding:11px 13px;display:flex;align-items:center;gap:12px}
  .st .name{flex:1;min-width:0}
  .st .brand{font-weight:700;font-size:14.5px}
  .st .addr{color:var(--dim);font-size:12px;margin-top:2px;overflow:hidden;
            text-overflow:ellipsis;white-space:nowrap}
  .st .price{text-align:right;flex:none}
  .st .p{font-size:17px;font-weight:800}
  .st .p.g{color:var(--acc)} .st .p.y{color:var(--warn)} .st .p.r{color:var(--hot)}
  .st .pu{font-size:11px;color:var(--dim)}
  .foot{color:var(--dim);font-size:11.5px;margin-top:16px;line-height:1.5}
  .spin{text-align:center;color:var(--dim);padding:30px}
</style>
</head>
<body>
  <h1>⛽ Цены АЗС Златоуста</h1>
  <div class="upd" id="upd">загрузка…</div>

  <div class="hero">
    <div class="row">
      <div class="box"><div class="lbl">АИ-92 минимум</div><div class="val" id="min92">—</div><div class="sub" id="min92s"></div></div>
      <div class="box"><div class="lbl">АИ-95 минимум</div><div class="val" id="min95">—</div><div class="sub" id="min95s"></div></div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab on" data-f="ai92">АИ-92</div>
    <div class="tab" data-f="ai95">АИ-95</div>
  </div>

  <div class="list" id="list"><div class="spin">Тянем свежие цены…</div></div>

  <div class="foot" id="foot"></div>

<script>
let DATA = null, FUEL = "ai92";
const cls = v => v==null ? "" : (v<70?"g":v<95?"y":"r");

function render(){
  if(!DATA) return;
  document.getElementById("upd").textContent =
    `Обновлено: ${DATA.updated} · всего ${DATA.count} АЗС с бензином`;
  const s92 = DATA.stations.filter(s=>s.ai92!=null).sort((a,b)=>a.ai92-b.ai92);
  const s95 = DATA.stations.filter(s=>s.ai95!=null).sort((a,b)=>a.ai95-b.ai95);
  if(s92[0]){ document.getElementById("min92").textContent = s92[0].ai92.toFixed(2)+" ₽";
    document.getElementById("min92s").textContent = s92[0].brand+" · "+s92[0].addr; }
  if(s95[0]){ document.getElementById("min95").textContent = s95[0].ai95.toFixed(2)+" ₽";
    document.getElementById("min95s").textContent = s95[0].brand+" · "+s95[0].addr; }

  const arr = (FUEL==="ai92"?s92:s95);
  document.getElementById("list").innerHTML = arr.map(s=>{
    const v = s[FUEL];
    return `<div class="st"><div class="name"><div class="brand">${s.brand}</div>
      <div class="addr">${s.addr}</div></div>
      <div class="price"><div class="p ${cls(v)}">${v.toFixed(2)} ₽</div>
      <div class="pu">${FUEL==="ai92"?"АИ-92":"АИ-95"}</div></div></div>`;
  }).join("");

  document.getElementById("foot").innerHTML =
    "📡 Источники: benzinanet.com · benzonavt.ru<br>⚠️ Данные справочные (агрегатор) — на табло АЗС могут отличаться.";
}

document.querySelectorAll(".tab").forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(x=>x.classList.remove("on"));
    t.classList.add("on"); FUEL = t.dataset.f; render();
  };
});

async function load(){
  try{
    const r = await fetch("/api/prices", {cache:"no-store"});
    DATA = await r.json();
    if(DATA.error) throw new Error(DATA.error);
    render();
  }catch(e){
    document.getElementById("list").innerHTML =
      `<div class="spin">Ошибка загрузки: ${e.message}</div>`;
  }
}
load();
setInterval(load, 120000); // автообновление каждые 2 мин
</script>
</body>
</html>
